name: Sync Forked Repositories

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  sync-all:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Tagged Forks
        env:
          # Authenticate using your Fine-Grained PAT
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          # Finds all forks in the org with the 'auto-sync' topic and syncs them
          gh repo list CSI-Pacific --fork --topic auto-sync --json nameWithOwner --jq '.[].nameWithOwner' | while read -r repo; do
            gh repo sync "$repo" --force || echo "::warning::Failed to sync $repo"
          done
